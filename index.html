<!doctype html>
<html lang="de" data-ui="obsidian">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070A12" />
    <script>
      try {
        var q = new URLSearchParams(window.location.search).get('ui');
        var map = { obsidian: 'obsidian', '1': 'obsidian', kinetic: 'kinetic', '2': 'kinetic', nocturne: 'nocturne', '3': 'nocturne' };
        var saved = window.localStorage.getItem('hht_ui_variant_v1');
        var v = (q && map[q.toLowerCase()]) || (saved && map[saved.toLowerCase()]) || 'obsidian';
        document.documentElement.dataset.ui = v;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Health Tracker" />
    <link rel="icon" href="./icon.svg?v=2" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=2" />
    <title>Health & Habit Tracker</title>
  </head>
  <body class="bg-zinc-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
